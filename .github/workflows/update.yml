name: Mise à jour des promos

on:
  schedule:
    - cron: "17 5,11,17 * * *"   # 3 fois par jour (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber pillow
      - run: python scripts/build_promos.py
      - name: Enregistrer s'il y a du nouveau
        run: |
          git config user.name "promos-bot"
          git config user.email "promos-bot@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Rien de nouveau"
          else
            git commit -m "Mise à jour des promos"
            git push
          fi
